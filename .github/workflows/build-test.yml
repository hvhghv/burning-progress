name: Build and test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-test.yml
      - Makefile
      - README.md
      - THIRD_PARTY_LICENSES.md
      - docs/**
      - include/**
      - src/**
      - tests/**
      - third_party/**
  pull_request:
    paths:
      - .github/workflows/build-test.yml
      - Makefile
      - README.md
      - THIRD_PARTY_LICENSES.md
      - docs/**
      - include/**
      - src/**
      - tests/**
      - third_party/**

permissions:
  actions: read
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: Native C99 build and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file libarchive-dev zlib1g-dev

      - name: Build and run native tests
        run: |
          set -euo pipefail
          make clean
          make all
          make test
          file build/bin/burning-init build/bin/burning-progress

  musl-build-test:
    name: ${{ matrix.toolchain }} (static)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64.tar.gz
            rootfs_asset: busybox-rootfs-1.38.0-x86_64-linux-musl-dynamic.tar.gz
            qemu: qemu-x86_64-static
          - toolchain: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm.tar.gz
            rootfs_asset: busybox-rootfs-1.38.0-arm-linux-musleabi-dynamic.tar.gz
            qemu: qemu-arm-static
          - toolchain: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64.tar.gz
            rootfs_asset: busybox-rootfs-1.38.0-aarch64-linux-musl-dynamic.tar.gz
            qemu: qemu-aarch64-static
          - toolchain: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64.tar.gz
            rootfs_asset: busybox-rootfs-1.38.0-riscv64-linux-musl-dynamic.tar.gz
            qemu: qemu-riscv64-static

    env:
      MUSL_RELEASE_BASE: https://github.com/hvhghv/musl-gcc/releases/download/musl-gcc
      BUSYBOX_RELEASE_BASE: https://github.com/hvhghv/cross-software/releases/download/v1.38.0-busybox
      ZLIB_ARCHIVE: zlib-1.3.2.tar.gz
      LIBARCHIVE_ARCHIVE: libarchive-3.8.8.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file qemu-user-static

      - name: Cache downloads and static libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/burning-progress-downloads
            ${{ runner.temp }}/static-deps/${{ matrix.toolchain }}
          key: burning-progress-deps-v4-size-${{ matrix.toolchain }}-${{ hashFiles('third_party/*.tar.gz') }}

      - name: Download toolchain and BusyBox rootfs
        env:
          TOOLCHAIN_ASSET: ${{ matrix.toolchain_asset }}
          ROOTFS_ASSET: ${{ matrix.rootfs_asset }}
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/burning-progress-downloads"
          mkdir -p "$downloads"

          if [ ! -s "$downloads/$TOOLCHAIN_ASSET" ]; then
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
              -o "$downloads/$TOOLCHAIN_ASSET" \
              "$MUSL_RELEASE_BASE/$TOOLCHAIN_ASSET"
          fi
          if [ ! -s "$downloads/$ROOTFS_ASSET" ]; then
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
              -o "$downloads/$ROOTFS_ASSET" \
              "$BUSYBOX_RELEASE_BASE/$ROOTFS_ASSET"
          fi
          if [ ! -s "$downloads/SHA256SUMS.busybox-1.38.0" ]; then
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
              -o "$downloads/SHA256SUMS.busybox-1.38.0" \
              "$BUSYBOX_RELEASE_BASE/SHA256SUMS"
          fi
          expected=$(awk -v name="$ROOTFS_ASSET" '$2 == name { print $1; exit }' \
            "$downloads/SHA256SUMS.busybox-1.38.0")
          test -n "$expected"
          actual=$(sha256sum "$downloads/$ROOTFS_ASSET" | awk '{ print $1 }')
          test "$actual" = "$expected"

      - name: Verify vendored dependency archives
        run: |
          set -euo pipefail
          cd third_party
          sha256sum -c SHA256SUMS

      - name: Install musl cross toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          TOOLCHAIN_ASSET: ${{ matrix.toolchain_asset }}
          QEMU_RUNNER: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          toolchain_root="$RUNNER_TEMP/musl-cross"
          rm -rf "$toolchain_root"
          mkdir -p "$toolchain_root"
          tar -xzf "$RUNNER_TEMP/burning-progress-downloads/$TOOLCHAIN_ASSET" \
            -C "$toolchain_root"

          compiler_path=$(find "$toolchain_root" -type f -name "${TOOLCHAIN}-gcc" \
            -print -quit)
          test -n "$compiler_path"
          chmod +x "$compiler_path"
          compiler_bin=$(dirname "$compiler_path")
          compiler_prefix=${compiler_path%-gcc}
          archiver=${compiler_prefix}-ar
          ranlib=${compiler_prefix}-ranlib
          stripper=${compiler_prefix}-strip
          sysroot=$($compiler_path -print-sysroot)
          test -d "$sysroot"
          test -x "$archiver"
          test -x "$ranlib"
          test -x "$stripper"
          command -v "$QEMU_RUNNER"

          echo "$compiler_bin" >> "$GITHUB_PATH"
          echo "MUSL_CC=$compiler_path" >> "$GITHUB_ENV"
          echo "MUSL_AR=$archiver" >> "$GITHUB_ENV"
          echo "MUSL_RANLIB=$ranlib" >> "$GITHUB_ENV"
          echo "MUSL_STRIP=$stripper" >> "$GITHUB_ENV"
          echo "MUSL_SYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "QEMU_RUNNER=$QEMU_RUNNER" >> "$GITHUB_ENV"
          "$compiler_path" --version

      - name: Build debug and release static dependencies
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          sources="$GITHUB_WORKSPACE/third_party"
          build_variant() {
            variant=$1
            variant_cflags=$2
            prefix="$RUNNER_TEMP/static-deps/$TOOLCHAIN/$variant"
            build_root="$RUNNER_TEMP/static-deps-build/$TOOLCHAIN/$variant"

            if [ -s "$prefix/lib/libarchive.a" ] && \
               [ -s "$prefix/lib/libz.a" ] && \
               [ -s "$prefix/include/archive.h" ] && \
               [ -s "$prefix/include/zlib.h" ]; then
              echo "Using cached $variant static libraries from $prefix"
              return
            fi

            rm -rf "$prefix" "$build_root"
            mkdir -p "$prefix" "$build_root/zlib" "$build_root/libarchive"
            tar -xzf "$sources/$ZLIB_ARCHIVE" \
              -C "$build_root/zlib" --strip-components=1
            (
              cd "$build_root/zlib"
              CHOST="$TOOLCHAIN" CC="$MUSL_CC" AR="$MUSL_AR" \
                RANLIB="$MUSL_RANLIB" CFLAGS="$variant_cflags" \
                ./configure --static --prefix="$prefix"
              make -j"$(nproc)"
              make install
            )

            tar -xzf "$sources/$LIBARCHIVE_ARCHIVE" \
              -C "$build_root/libarchive" --strip-components=1
            mkdir "$build_root/libarchive-build"
            (
              cd "$build_root/libarchive-build"
              CC="$MUSL_CC" AR="$MUSL_AR" RANLIB="$MUSL_RANLIB" \
                CFLAGS="$variant_cflags" CPPFLAGS="-I$prefix/include" \
                LDFLAGS="-L$prefix/lib" PKG_CONFIG=false \
                "$build_root/libarchive/configure" \
                  --build="$("$build_root/libarchive/build/autoconf/config.guess")" \
                  --host="$TOOLCHAIN" \
                  --prefix="$prefix" \
                  --disable-shared \
                  --enable-static \
                  --disable-dependency-tracking \
                  --disable-bsdtar \
                  --disable-bsdcat \
                  --disable-bsdcpio \
                  --disable-bsdunzip \
                  --disable-acl \
                  --disable-xattr \
                  --without-bz2lib \
                  --without-libb2 \
                  --without-iconv \
                  --without-lz4 \
                  --without-zstd \
                  --without-lzma \
                  --without-cng \
                  --without-openssl \
                  --without-xml2 \
                  --without-expat
              make -j"$(nproc)"
              make install
            )
          }

          debug_cflags='-Og -g3 -fno-omit-frame-pointer -ffunction-sections -fdata-sections'
          release_cflags='-Os -g0 -fno-asynchronous-unwind-tables -fno-unwind-tables -ffunction-sections -fdata-sections'
          build_variant debug "$debug_cflags"
          build_variant release "$release_cflags"

          debug_prefix="$RUNNER_TEMP/static-deps/$TOOLCHAIN/debug"
          release_prefix="$RUNNER_TEMP/static-deps/$TOOLCHAIN/release"
          echo "DEBUG_STATIC_DEPS=$debug_prefix" >> "$GITHUB_ENV"
          echo "RELEASE_STATIC_DEPS=$release_prefix" >> "$GITHUB_ENV"

      - name: Build debug and stripped-release programs
        run: |
          set -euo pipefail
          debug_build="$RUNNER_TEMP/debug-build"
          rm -rf "$debug_build"
          make BUILD_DIR="$debug_build" CC="$MUSL_CC" \
            CPPFLAGS="-D_GNU_SOURCE -Iinclude -I$DEBUG_STATIC_DEPS/include" \
            CFLAGS="-Og -g3 -fno-omit-frame-pointer -ffunction-sections -fdata-sections -std=c99 -Wall -Wextra -Wpedantic -Werror" \
            LDFLAGS="-static -L$DEBUG_STATIC_DEPS/lib -Wl,--gc-sections -Wl,--build-id=none" \
            all

          make clean
          make CC="$MUSL_CC" \
            CPPFLAGS="-D_GNU_SOURCE -Iinclude -I$RELEASE_STATIC_DEPS/include" \
            CFLAGS="-Os -g0 -fno-asynchronous-unwind-tables -fno-unwind-tables -ffunction-sections -fdata-sections -std=c99 -Wall -Wextra -Wpedantic -Werror" \
            LDFLAGS="-static -L$RELEASE_STATIC_DEPS/lib -Wl,--gc-sections -Wl,--build-id=none" \
            all \
            build/tests/test_config \
            build/tests/test_install \
            build/tests/test_cpio
          echo "DEBUG_BUILD=$debug_build" >> "$GITHUB_ENV"

      - name: Verify debug symbols and strip release programs
        run: |
          set -euo pipefail
          for binary in \
            "$DEBUG_BUILD/bin/burning-init" \
            "$DEBUG_BUILD/bin/burning-progress"; do
            description=$(file "$binary")
            echo "$description"
            grep -qi 'statically linked' <<<"$description"
            sections=$(readelf -S "$binary")
            program_headers=$(readelf -l "$binary")
            dynamic=$(readelf -d "$binary" 2>/dev/null || true)
            grep -q '\.debug_info' <<<"$sections"
            ! grep -q 'INTERP' <<<"$program_headers"
            ! grep -q 'NEEDED' <<<"$dynamic"
          done
          debug_init_size=$(stat -c %s "$DEBUG_BUILD/bin/burning-init")
          debug_progress_size=$(stat -c %s "$DEBUG_BUILD/bin/burning-progress")
          printf 'debugSize burning-init=%s burning-progress=%s\n' \
            "$debug_init_size" "$debug_progress_size"

          "$MUSL_STRIP" --strip-all \
            build/bin/burning-init \
            build/bin/burning-progress
          for binary in build/bin/burning-init build/bin/burning-progress; do
            description=$(file "$binary")
            echo "$description"
            grep -qi 'statically linked' <<<"$description"
            grep -qi 'stripped' <<<"$description"
            sections=$(readelf -S "$binary")
            program_headers=$(readelf -l "$binary")
            dynamic=$(readelf -d "$binary" 2>/dev/null || true)
            ! grep -Eq '\.debug_|\.symtab' <<<"$sections"
            ! grep -q 'INTERP' <<<"$program_headers"
            ! grep -q 'NEEDED' <<<"$dynamic"
          done

          init_size=$(stat -c %s build/bin/burning-init)
          progress_size=$(stat -c %s build/bin/burning-progress)
          printf 'releaseSize burning-init=%s burning-progress=%s\n' \
            "$init_size" "$progress_size"
          test "$init_size" -le 262144
          test "$progress_size" -le 786432

      - name: Prepare matching BusyBox rootfs
        env:
          ROOTFS_ASSET: ${{ matrix.rootfs_asset }}
        run: |
          set -euo pipefail
          rootfs="$RUNNER_TEMP/busybox-rootfs"
          rm -rf "$rootfs"
          "$QEMU_RUNNER" build/bin/burning-progress rootfs unpack \
            "$RUNNER_TEMP/burning-progress-downloads/$ROOTFS_ASSET" \
            --output "$rootfs"

          test -x "$rootfs/bin/busybox"
          test -e "$rootfs/bin/sh"
          test "$rootfs/bin/busybox" -ef "$rootfs/usr/sbin/busybox"
          test -n "$(find "$rootfs/lib" -maxdepth 1 -name 'ld-musl-*.so.1' -print -quit)"
          for directory in bin sbin etc dev proc sys run usr var tmp root; do
            test -d "$rootfs/$directory"
          done
          for file in etc/passwd etc/group etc/inittab etc/init.d/rcS; do
            test -f "$rootfs/$file"
          done

          install -m 0755 build/bin/burning-init "$rootfs/sbin/burning-init"
          install -m 0755 build/bin/burning-progress "$rootfs/sbin/burning-progress"
          printf '%s\n' \
            'version=1' \
            'entryMode=supervised' \
            'entry=/entry.sh' > "$rootfs/etc/burning-progress.conf"
          printf '%s\n' \
            '#!/bin/sh' \
            'echo BURNING_PROGRESS_ROOTFS_OK' \
            'exit 0' > "$rootfs/entry.sh"
          chmod 0755 "$rootfs/entry.sh"
          echo "BUSYBOX_ROOTFS=$rootfs" >> "$GITHUB_ENV"

      - name: Run target unit tests through QEMU
        run: |
          set -euo pipefail
          for test_binary in \
            build/tests/test_config \
            build/tests/test_install \
            build/tests/test_cpio; do
            "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" "$test_binary"
          done

          config_root="$RUNNER_TEMP/interactive-config-root"
          rm -rf "$config_root"
          mkdir -p "$config_root"
          printf '%s\n' handoff /sbin/init | \
            "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
              build/bin/burning-progress rootfs configure "$config_root"
          grep -q '^version=1$' "$config_root/etc/burning-progress.conf"
          grep -q '^entryMode=handoff$' "$config_root/etc/burning-progress.conf"
          grep -q '^entry=/sbin/init$' "$config_root/etc/burning-progress.conf"

      - name: Test CPIO and tar.gz recovery rootfs archives
        run: |
          set -euo pipefail
          for format in cpio tar.gz; do
            archive="$RUNNER_TEMP/rootfs.$format"
            unpacked="$RUNNER_TEMP/unpacked-rootfs-$format"
            "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
              build/bin/burning-progress rootfs pack "$BUSYBOX_ROOTFS" \
              --output "$archive"
            verify_output=$("$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
              build/bin/burning-progress rootfs verify "$archive")
            printf '%s\n' "$verify_output"
            grep -q "^format=$format$" <<<"$verify_output"
            test -s "$archive"

            "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
              build/bin/burning-progress rootfs unpack "$archive" \
              --output "$unpacked"
            test -x "$unpacked/bin/sh"
            test -x "$unpacked/sbin/burning-progress"
            test -x "$unpacked/entry.sh"
            grep -q '^entryMode=supervised$' \
              "$unpacked/etc/burning-progress.conf"
            if "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
              build/bin/burning-progress rootfs unpack "$archive" \
              --output "$unpacked"; then
              echo "$format unpack accepted a non-empty destination" >&2
              exit 1
            fi
          done
          echo "RECOVERY_ARCHIVE=$RUNNER_TEMP/rootfs.tar.gz" >> "$GITHUB_ENV"

      - name: Test management commands in an isolated root
        run: |
          set -euo pipefail
          host_root="$RUNNER_TEMP/host-root"
          mkdir -p "$host_root/sbin" "$host_root/lib/systemd"
          printf '%s\n' '#!/bin/sh' 'exit 0' > "$host_root/lib/systemd/systemd"
          chmod 0755 "$host_root/lib/systemd/systemd"
          ln -s ../lib/systemd/systemd "$host_root/sbin/init"

          sudo "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
            build/bin/burning-progress --root "$host_root" install \
            --init-binary "$GITHUB_WORKSPACE/build/bin/burning-init" \
            --progress-binary "$GITHUB_WORKSPACE/build/bin/burning-progress"
          sudo "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
            build/bin/burning-progress --root "$host_root" \
            config --timeout 1 --default normal
          sudo "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
            build/bin/burning-progress --root "$host_root" enable --once
          sudo "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
            build/bin/burning-progress --root "$host_root" \
            rootfs install "$RECOVERY_ARCHIVE"

          status_output=$(sudo "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
            build/bin/burning-progress --root "$host_root" status)
          printf '%s\n' "$status_output"
          grep -q '^installed=true$' <<<"$status_output"
          grep -q '^enabled=true$' <<<"$status_output"
          grep -q '^onlyOnce=true$' <<<"$status_output"
          grep -q '^rootfsInstalled=true$' <<<"$status_output"
          grep -q '^timeout=1$' <<<"$status_output"
          grep -q '^default=normal$' <<<"$status_output"

          sudo "$QEMU_RUNNER" -L "$BUSYBOX_ROOTFS" \
            build/bin/burning-progress --root "$host_root" uninstall
          test -L "$host_root/sbin/init"
          test "$(readlink "$host_root/sbin/init")" = ../lib/systemd/systemd

      - name: Package release and debug programs
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/artifacts"
          mkdir -p "$artifact_root"

          package_variant() {
            package_name=$1
            binary_root=$2
            package_root="$RUNNER_TEMP/package/$package_name"
            mkdir -p "$package_root"
            install -m 0755 "$binary_root/burning-init" \
              "$package_root/burning-init"
            install -m 0755 "$binary_root/burning-progress" \
              "$package_root/burning-progress"
            install -m 0644 LICENSE "$package_root/LICENSE"
            install -m 0644 THIRD_PARTY_LICENSES.md \
              "$package_root/THIRD_PARTY_LICENSES.md"
            tar -czf "$artifact_root/$package_name.tar.gz" \
              -C "$RUNNER_TEMP/package" "$package_name"
            (
              cd "$artifact_root"
              sha256sum "$package_name.tar.gz" \
                > "$package_name.tar.gz.sha256"
            )
          }

          package_variant \
            "burning-progress-${TOOLCHAIN}-static" \
            "$GITHUB_WORKSPACE/build/bin"
          package_variant \
            "burning-progress-${TOOLCHAIN}-static-debug" \
            "$DEBUG_BUILD/bin"

      - name: Upload stripped release package
        uses: actions/upload-artifact@v4
        with:
          name: burning-progress-${{ matrix.toolchain }}-static
          path: |
            ${{ runner.temp }}/artifacts/burning-progress-${{ matrix.toolchain }}-static.tar.gz
            ${{ runner.temp }}/artifacts/burning-progress-${{ matrix.toolchain }}-static.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug-symbol package
        uses: actions/upload-artifact@v4
        with:
          name: burning-progress-${{ matrix.toolchain }}-static-debug
          path: |
            ${{ runner.temp }}/artifacts/burning-progress-${{ matrix.toolchain }}-static-debug.tar.gz
            ${{ runner.temp }}/artifacts/burning-progress-${{ matrix.toolchain }}-static-debug.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  qemu-system-test:
    name: QEMU system PID 1 and pivot_root test
    needs:
      - native-test
      - musl-build-test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ROOTFS_ASSET: busybox-rootfs-1.38.0-x86_64-linux-musl-dynamic.tar.gz
      BUSYBOX_RELEASE_BASE: https://github.com/hvhghv/cross-software/releases/download/v1.38.0-busybox

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install QEMU system and guest kernel
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            e2fsprogs linux-image-virtual qemu-system-x86
          command -v qemu-system-x86_64

          kernel_source=$(find /boot -maxdepth 1 -type f -name 'vmlinuz-*-generic' \
            -print | sort -V | tail -n 1)
          test -n "$kernel_source"
          initrd_source=${kernel_source/vmlinuz-/initrd.img-}
          sudo test -r "$initrd_source"
          guest_kernel="$RUNNER_TEMP/guest-vmlinuz"
          guest_initrd="$RUNNER_TEMP/guest-initrd.img"
          sudo install -m 0644 "$kernel_source" "$guest_kernel"
          sudo install -m 0644 "$initrd_source" "$guest_initrd"
          echo "GUEST_KERNEL=$guest_kernel" >> "$GITHUB_ENV"
          echo "GUEST_INITRD=$guest_initrd" >> "$GITHUB_ENV"

      - name: Download x86_64 static target package
        uses: actions/download-artifact@v4
        with:
          name: burning-progress-x86_64-linux-musl-static
          path: ${{ runner.temp }}/target-package

      - name: Verify and extract target package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/target-package"
          package_name=burning-progress-x86_64-linux-musl-static
          (
            cd "$package_dir"
            sha256sum -c "$package_name.tar.gz.sha256"
          )
          target_bin="$RUNNER_TEMP/target-bin"
          mkdir -p "$target_bin"
          tar -xzf "$package_dir/$package_name.tar.gz" \
            -C "$target_bin" --strip-components=1
          test -x "$target_bin/burning-init"
          test -x "$target_bin/burning-progress"
          file "$target_bin/burning-init" "$target_bin/burning-progress" \
            | tee "$RUNNER_TEMP/qemu-system-targets.txt"
          grep -q 'statically linked' "$RUNNER_TEMP/qemu-system-targets.txt"
          echo "TARGET_BIN=$target_bin" >> "$GITHUB_ENV"

      - name: Download and verify BusyBox rootfs
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/qemu-system-downloads"
          mkdir -p "$downloads"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -o "$downloads/$ROOTFS_ASSET" \
            "$BUSYBOX_RELEASE_BASE/$ROOTFS_ASSET"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -o "$downloads/SHA256SUMS" \
            "$BUSYBOX_RELEASE_BASE/SHA256SUMS"

          expected=$(awk -v name="$ROOTFS_ASSET" \
            '$2 == name { print $1; exit }' "$downloads/SHA256SUMS")
          actual=$(sha256sum "$downloads/$ROOTFS_ASSET" | awk '{ print $1 }')
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Build guest system and recovery rootfs
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qemu-system"
          base_root="$work/rootfs-base"
          boot_root="$work/boot-root"
          recovery_root="$work/recovery-root"
          mkdir -p "$base_root" "$boot_root" "$recovery_root"
          tar -xzf "$RUNNER_TEMP/qemu-system-downloads/$ROOTFS_ASSET" \
            -C "$base_root" --strip-components=1
          cp -a "$base_root/." "$boot_root/"
          cp -a "$base_root/." "$recovery_root/"

          install -m 0755 "$TARGET_BIN/burning-progress" \
            "$recovery_root/sbin/burning-progress"
          printf '%s\n' \
            'version=1' \
            'entryMode=supervised' \
            'entry=/entry.sh' > "$recovery_root/etc/burning-progress.conf"
          printf '%s\n' \
            '#!/bin/sh' \
            'fail() {' \
            '  echo "BURNING_PROGRESS_QEMU_SYSTEM_FAIL: $*" >/dev/console' \
            '  poweroff -f' \
            '  exit 1' \
            '}' \
            'pid1=$(readlink /proc/1/exe) || fail "cannot read PID 1"' \
            '[ "$pid1" = /sbin/burning-progress ] || fail "unexpected PID 1: $pid1"' \
            '! grep -Eq " /oldroot(/[^ ]*)? " /proc/self/mountinfo || fail "old root is mounted"' \
            'grep -q " /proc " /proc/self/mountinfo || fail "/proc is not mounted"' \
            'grep -q " /sys " /proc/self/mountinfo || fail "/sys is not mounted"' \
            'grep -q " /dev " /proc/self/mountinfo || fail "/dev is not mounted"' \
            'grep -q " /run " /proc/self/mountinfo || fail "/run is not mounted"' \
            'echo "BURNING_PROGRESS_QEMU_SYSTEM_OK pid1=$pid1" >/dev/console' \
            'sync' \
            'poweroff -f' \
            'exit 1' > "$recovery_root/entry.sh"
          chmod 0755 "$recovery_root/entry.sh"

          recovery_archive="$work/rootfs.tar.gz"
          "$TARGET_BIN/burning-progress" rootfs pack "$recovery_root" \
            --output "$recovery_archive" --format tar.gz
          verify_output=$("$TARGET_BIN/burning-progress" \
            rootfs verify "$recovery_archive")
          printf '%s\n' "$verify_output"
          grep -q '^format=tar.gz$' <<<"$verify_output"

          sudo "$TARGET_BIN/burning-progress" --root "$boot_root" install \
            --init-binary "$TARGET_BIN/burning-init" \
            --progress-binary "$TARGET_BIN/burning-progress"
          sudo "$TARGET_BIN/burning-progress" --root "$boot_root" \
            config --timeout 0 --default shell
          sudo "$TARGET_BIN/burning-progress" --root "$boot_root" \
            rootfs install "$recovery_archive"
          sudo "$TARGET_BIN/burning-progress" --root "$boot_root" \
            enable --persistent

          sudo rm -f "$boot_root/dev/console" "$boot_root/dev/null" \
            "$boot_root/dev/tty" "$boot_root/dev/zero"
          sudo mknod -m 0600 "$boot_root/dev/console" c 5 1
          sudo mknod -m 0666 "$boot_root/dev/null" c 1 3
          sudo mknod -m 0666 "$boot_root/dev/tty" c 5 0
          sudo mknod -m 0666 "$boot_root/dev/zero" c 1 5

          system_image="$work/system.ext4"
          truncate -s 512M "$system_image"
          sudo mkfs.ext4 -q -F -L burning-system -d "$boot_root" "$system_image"
          echo "QEMU_SYSTEM_WORK=$work" >> "$GITHUB_ENV"
          echo "QEMU_SYSTEM_IMAGE=$system_image" >> "$GITHUB_ENV"

      - name: Boot burning-progress as guest PID 1
        run: |
          set -euo pipefail
          serial_log="$QEMU_SYSTEM_WORK/serial.log"
          set +e
          timeout --signal=TERM 180s qemu-system-x86_64 \
            -machine pc,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 1024M \
            -kernel "$GUEST_KERNEL" \
            -initrd "$GUEST_INITRD" \
            -append 'root=/dev/vda rootfstype=ext4 rw console=ttyS0 init=/sbin/init panic=-1' \
            -drive "file=$QEMU_SYSTEM_IMAGE,format=raw,if=virtio,cache=unsafe" \
            -display none \
            -serial stdio \
            -monitor none \
            -net none \
            -no-reboot 2>&1 | tee "$serial_log"
          qemu_status=${PIPESTATUS[0]}
          set -e

          if [ "$qemu_status" -ne 0 ]; then
            echo "qemu-system-x86_64 exited with status $qemu_status" >&2
          fi
          ! grep -q 'BURNING_PROGRESS_QEMU_SYSTEM_FAIL:' "$serial_log"
          grep -q 'BURNING_PROGRESS_QEMU_SYSTEM_OK pid1=/sbin/burning-progress' \
            "$serial_log"

      - name: Upload QEMU serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-x86_64-serial-log
          path: ${{ runner.temp }}/qemu-system/serial.log
          if-no-files-found: warn
          retention-days: 7
